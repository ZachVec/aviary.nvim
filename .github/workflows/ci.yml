name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the plugin claims, and the release it is developed on.
        neovim: [v0.11.0, stable]
    name: Neovim ${{ matrix.neovim }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${{ matrix.neovim }}/nvim-linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/nvim.tar.gz -C /opt
          sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim

      # Pigeon's floating views require tmux 3.8's new-pane command.
      - name: Install tmux 3.8
        env:
          TMUX_VERSION: "3.8"
          TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libevent-dev libncurses-dev pkg-config bison
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tmux.tar.gz" \
            "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  $RUNNER_TEMP/tmux.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tmux.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-$TMUX_VERSION"
          ./configure --prefix=/usr/local
          make -j2
          sudo make install
          tmux -V

      # lazy.nvim's hererocks builds Lua 5.1 for luassert and needs readline headers.
      - name: Install Lua build dependencies
        run: sudo apt-get install -y --no-install-recommends libreadline-dev

      - name: Lua format
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

      - name: Test
        run: make test
