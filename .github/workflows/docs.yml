name: Documentation

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: vimdoc-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Install Pandoc
        run: |
          source scripts/docs-tools.env
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pandoc.tar.gz" \
            "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-linux-amd64.tar.gz"
          echo "$PANDOC_LINUX_AMD64_SHA256  $RUNNER_TEMP/pandoc.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pandoc-$PANDOC_VERSION/bin" >> "$GITHUB_PATH"
      - name: Generate and verify help
        run: make docs-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vimdoc
          path: doc/*.nvim.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Create documentation publishing token
        id: docs-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ steps.docs-token.outputs.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vimdoc
          path: ${{ runner.temp }}/vimdoc
      - name: Publish changed help if the validated commit is still current
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/vimdoc
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TESTED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/publish-docs "$ARTIFACT_DIR" "$DEFAULT_BRANCH" "$TESTED_HEAD"
